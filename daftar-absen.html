<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Absen — AbsenKu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            --accent: #8b5cf6;
            --bg: #f1f2f8;
            --surface: #ffffff;
            --surface-2: #f7f8fd;
            --border: #e6e9f2;
            --text: #0f172a;
            --text-2: #5b6272;
            --soft: rgba(139, 92, 246, .10);
            --soft-text: #7c3aed;
            --glass-nav: rgba(255, 255, 255, .72);
            --shadow: 0 10px 30px rgba(31, 35, 65, .08);
        }
        [data-theme="dark"] {
            --bg: #0a0f1e;
            --surface: #121a2e;
            --surface-2: #1a243d;
            --border: #243049;
            --text: #e6e9f2;
            --text-2: #94a3b8;
            --soft: rgba(139, 92, 246, .18);
            --soft-text: #c4b5fd;
            --glass-nav: rgba(10, 15, 30, .72);
            --shadow: 0 12px 30px rgba(0, 0, 0, .35);
            --bs-body-bg: var(--bg);
            --bs-body-color: var(--text);
            --bs-border-color: var(--border);
            --bs-secondary-color: var(--text-2);
            --bs-secondary-bg: var(--surface-2);
            --bs-tertiary-bg: var(--surface-2);
            --bs-body-color-rgb: 230, 233, 242;
            --bs-body-bg-rgb: 10, 15, 30;
            --bs-secondary-color-rgb: 148, 163, 184;
            --bs-secondary-bg-rgb: 26, 36, 61;
        }
        * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s ease, color .3s ease;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #c6cbd8; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #aab0c0; }
        [data-theme="dark"] ::-webkit-scrollbar-thumb { background: #2c3a5a; }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover { background: #3a4a73; }

        /* ---------- Navbar ---------- */
        .navbar-glass {
            position: sticky; top: 0; z-index: 1030;
            background: var(--glass-nav);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .brand-icon {
            width: 36px; height: 36px; border-radius: .75rem;
            background: var(--grad); color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.1rem; box-shadow: 0 4px 12px rgba(139, 92, 246, .35);
        }
        .text-gradient {
            background: var(--grad);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-icon {
            width: 38px; height: 38px; border-radius: .75rem;
            border: 1px solid var(--border); background: var(--surface);
            color: var(--text); display: inline-flex; align-items: center; justify-content: center;
            transition: all .2s ease; font-size: 1rem;
        }
        .btn-icon:hover { background: var(--surface-2); transform: translateY(-1px); }
        .pill-soft {
            background: var(--soft); color: var(--soft-text);
            font-weight: 600; border-radius: 2rem;
        }
        .btn-grad { background: var(--grad); color: #fff; font-weight: 600; transition: all .2s ease; }
        .btn-grad:hover { color: #fff; filter: brightness(1.08); transform: translateY(-1px); }
        .btn-glass {
            background: rgba(255,255,255,.18); color: #fff;
            border: 1px solid rgba(255,255,255,.4); font-weight: 600; transition: all .2s ease;
        }
        .btn-glass:hover { background: rgba(255,255,255,.3); color: #fff; transform: translateY(-1px); }

        /* ---------- Hero ---------- */
        .hero {
            background: var(--grad);
            color: #fff;
            border-radius: 0 0 3rem 3rem;
            padding: 2.25rem 0 3.25rem;
            position: relative;
            overflow: hidden;
        }
        .hero::before, .hero::after {
            content: ''; position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, .08);
        }
        .hero::before { width: 340px; height: 340px; top: -140px; right: -70px; }
        .hero::after { width: 220px; height: 220px; bottom: -110px; left: 6%; }
        .hero .badge-soft { background: rgba(255,255,255,.2); color: #fff; }
        .hero-date { font-size: .95rem; opacity: .9; }
        .hero-panel {
            background: rgba(255, 255, 255, .13);
            border: 1px solid rgba(255, 255, 255, .28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: relative; z-index: 1;
        }
        .hero input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .hero input[type="date"] { color-scheme: dark; }

        /* ---------- Layout & Cards ---------- */
        .main-wrap { margin-top: -2.5rem; }
        .card {
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 1.25rem;
            box-shadow: var(--shadow);
            transition: background .3s ease, border-color .3s ease;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            border-radius: 1.25rem 1.25rem 0 0 !important;
            padding-top: 1.1rem;
        }
        .card-header i { color: var(--accent); }

        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .85rem; color: #fff;
            background: var(--grad); flex-shrink: 0;
        }

        .table-head th {
            background: var(--surface-2);
            color: var(--text-2);
            text-transform: uppercase;
            font-size: .72rem;
            letter-spacing: .05em;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }
        .table > :not(caption) > * > * { border-bottom-color: var(--border); background-color: transparent; }
        .table-hover > tbody > tr:hover > * { background-color: var(--surface-2); }
        tbody tr { animation: rowIn .3s ease both; }
        @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        .st-badge {
            display: inline-block; padding: .25rem .7rem;
            border-radius: 2rem; font-weight: 600; font-size: .75rem;
        }
        .st-hadir { background:#d1fae5; color:#059669; }
        .st-sakit { background:#fef3c7; color:#d97706; }
        .st-izin  { background:#dbeafe; color:#2563eb; }
        .st-alpa  { background:#fee2e2; color:#dc2626; }
        .st-b     { background:#e5e7eb; color:#6b7280; }

        .stat-card {
            border-radius: 1rem;
            transition: transform .18s ease, box-shadow .18s ease;
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(31,35,65,.12); }
        .stat-icon {
            width: 40px; height: 40px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: .8rem; font-size: 1.15rem; flex-shrink: 0;
        }
        .ic-hadir { background:#d1fae5; color:#059669; }
        .ic-sakit { background:#fef3c7; color:#d97706; }
        .ic-izin  { background:#dbeafe; color:#2563eb; }
        .ic-alpa  { background:#fee2e2; color:#dc2626; }
        .ic-belum { background:#e5e7eb; color:#6b7280; }

        /* ---------- Daftar Tanggal ---------- */
        .list-tgl { max-height: 560px; overflow-y: auto; }
        .tgl-item {
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: .9rem;
            padding: .65rem .85rem;
            cursor: pointer;
            transition: all .15s ease;
            display: flex;
            align-items: center;
            gap: .7rem;
        }
        .tgl-item:hover { border-color: var(--accent); transform: translateY(-1px); }
        .tgl-item.active {
            border-color: var(--accent);
            background: var(--soft);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, .18);
        }
        .tgl-num {
            width: 42px; height: 42px; border-radius: .8rem;
            background: var(--grad); color: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            flex-shrink: 0; font-weight: 800; line-height: 1.1;
        }
        .tgl-num small { font-size: .58rem; font-weight: 600; text-transform: uppercase; opacity: .9; }
        .empty-state { padding: 3rem 1rem; }
        .empty-state i { font-size: 3rem; color: var(--text-2); opacity: .4; }

        .filter-btn {
            border-radius: 2rem;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text-2);
            font-weight: 600; font-size: .78rem;
            padding: .3rem .8rem;
            transition: all .15s ease;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--soft-text); }
        .filter-btn.active-hadir { background:#059669; border-color:#059669; color:#fff; }
        .filter-btn.active-sakit { background:#d97706; border-color:#d97706; color:#fff; }
        .filter-btn.active-izin  { background:#2563eb; border-color:#2563eb; color:#fff; }
        .filter-btn.active-alpa  { background:#dc2626; border-color:#dc2626; color:#fff; }
        .filter-btn.active-belum { background:#6b7280; border-color:#6b7280; color:#fff; }
        .filter-btn.active-semua { background: var(--accent); border-color: var(--accent); color:#fff; }

        .btn-hapus {
            border: none; background: transparent; color: var(--text-2);
            transition: all .15s ease; border-radius: .5rem;
        }
        .btn-hapus:hover { color:#dc2626; background:#fee2e2; }
        .toast { background: var(--grad); color: #fff; border: none; }
        .toast .btn-close { filter: invert(1); }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand navbar-glass py-2">
    <div class="container">
        <a href="index.html" class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0 text-decoration-none text-reset">
            <span class="brand-icon"><i class="bi bi-clipboard2-check"></i></span>
            Absen<span class="text-gradient">Ku</span>
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
            <a href="index.html" class="btn-icon" title="Kembali ke halaman utama"><i class="bi bi-arrow-left"></i></a>
            <button class="btn-icon" id="btnTema" onclick="toggleTema()" title="Ganti tema gelap/terang">
                <i class="bi bi-moon-stars"></i>
            </button>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="hero">
    <div class="container position-relative">
        <div class="row align-items-center gy-4">
            <div class="col-md-7">
                <span class="badge badge-soft mb-2"><i class="bi bi-journal-text me-1"></i>Lihat Data Absen</span>
                <h1 class="display-6 fw-bold mb-2">Daftar Absen &amp; Tanggal</h1>
                <p class="hero-date mb-3" id="heroTanggal"></p>
                <p class="opacity-75 mb-0"><i class="bi bi-info-circle me-1"></i>Pilih tanggal dari daftar untuk melihat absen peserta pada hari tersebut.</p>
            </div>
            <div class="col-md-5">
                <div class="hero-panel p-3 p-sm-4 rounded-4">
                    <div class="small text-uppercase letter-spacing opacity-75 mb-2"><i class="bi bi-calendar3 me-1"></i>Navigasi Tanggal</div>
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-glass btn-sm" onclick="geserTanggal(-1)" title="Tanggal sebelumnya"><i class="bi bi-chevron-left"></i></button>
                        <input type="date" id="inputTanggal" class="form-control form-control-sm" onchange="pilihDariPicker()">
                        <button class="btn btn-glass btn-sm" onclick="geserTanggal(1)" title="Tanggal berikutnya"><i class="bi bi-chevron-right"></i></button>
                    </div>
                    <div class="text-center mt-2">
                        <button class="btn btn-link btn-sm text-white text-decoration-none opacity-75" onclick="keHariIni()"><i class="bi bi-arrow-repeat me-1"></i>Kembali ke hari ini</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="container main-wrap pb-5">
    <div class="row g-4">
        <!-- Daftar Tanggal -->
        <div class="col-lg-4">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-calendar2-week me-2"></i>Daftar Tanggal Absen</span>
                    <span id="jumlahTanggal" class="pill-soft badge px-3 py-2"></span>
                </div>
                <div class="card-body">
                    <div class="list-tgl" id="listTgl"></div>
                    <div id="emptyTgl" class="empty-state text-center text-secondary d-none">
                        <i class="bi bi-calendar-x d-block mb-2"></i>
                        Belum ada data absen.<br>Catat absen di halaman utama terlebih dahulu.
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail per Tanggal -->
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <span><i class="bi bi-people-fill me-2"></i>Absen Peserta — <span id="judulTgl" class="text-gradient"></span></span>
                    <button class="btn btn-outline-danger btn-sm" onclick="hapusTgl(getTanggal())" title="Hapus semua data absen pada tanggal ini"><i class="bi bi-trash3 me-1"></i>Hapus Data Tanggal Ini</button>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3" id="statCards"></div>

                    <div class="d-flex flex-wrap gap-2 mb-3" id="filterBox"></div>

                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="inputCari" class="form-control border-start-0" placeholder="Cari nama peserta..." oninput="renderTabel()">
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-head">
                                <tr>
                                    <th style="width:50px">No</th>
                                    <th>Nama</th>
                                    <th class="text-center">Status</th>
                                    <th style="width:60px"></th>
                                </tr>
                            </thead>
                            <tbody id="tbodyPeserta"></tbody>
                        </table>
                    </div>
                    <div id="emptyPeserta" class="empty-state text-center text-secondary d-none">
                        <i class="bi bi-inbox d-block mb-2"></i>
                        Tidak ada peserta yang cocok.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill"></i><span id="toastBody"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    const STORAGE_KEY = 'absen_data';
    const TEMA_KEY = 'absen_tema';
    const STATUS = {
        hadir: { label: 'Hadir', icon: 'bi-check2-circle' },
        sakit: { label: 'Sakit', icon: 'bi-heart-pulse' },
        izin:  { label: 'Izin',  icon: 'bi-calendar2-x' },
        alpa:  { label: 'Alpa',  icon: 'bi-x-circle' }
    };
    const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

    let data = loadData();
    let filter = 'semua';

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) return JSON.parse(raw);
        } catch (e) {}
        return { peserta: [], records: {} };
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showToast(msg) {
        const el = document.getElementById('toast');
        document.getElementById('toastBody').textContent = msg;
        new bootstrap.Toast(el, { delay: 1800 }).show();
    }

    function tanggalHariIni() {
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function formatTanggal(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return `${HARI[dt.getDay()]}, ${d} ${BULAN[m - 1]} ${y}`;
    }

    function inisial(nama) {
        const parts = nama.trim().split(/\s+/);
        return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
    }

    function esc(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    function inline(nama) {
        return nama.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function tglList() {
        return Object.keys(data.records).sort().reverse();
    }

    /* ---------- Tema ---------- */
    function initTema() {
        const saved = localStorage.getItem(TEMA_KEY);
        const gelap = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', gelap ? 'dark' : 'light');
        updateTemaIcon();
    }
    function toggleTema() {
        const gelap = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', gelap ? 'light' : 'dark');
        localStorage.setItem(TEMA_KEY, gelap ? 'light' : 'dark');
        updateTemaIcon();
    }
    function updateTemaIcon() {
        const gelap = document.documentElement.getAttribute('data-theme') === 'dark';
        document.getElementById('btnTema').innerHTML =
            `<i class="bi ${gelap ? 'bi-sun' : 'bi-moon-stars'}"></i>`;
    }

    /* ---------- Navigasi ---------- */
    function getTanggal() {
        const el = document.getElementById('inputTanggal');
        return el.value;
    }

    function pilihTgl(iso) {
        document.getElementById('inputTanggal').value = iso;
        render();
    }

    function pilihDariPicker() {
        render();
    }

    function geserTanggal(selisih) {
        const [y, m, d] = getTanggal().split('-').map(Number);
        const dt = new Date(y, m - 1, d + selisih);
        const p = n => String(n).padStart(2, '0');
        pilihTgl(`${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`);
    }

    function keHariIni() {
        pilihTgl(tanggalHariIni());
    }

    /* ---------- Render ---------- */
    function hitungHari(rec) {
        const c = { hadir: 0, sakit: 0, izin: 0, alpa: 0, belum: 0 };
        data.peserta.forEach(nama => {
            const s = rec[nama];
            if (s) c[s]++;
            else c.belum++;
        });
        return c;
    }

    function renderListTgl() {
        const list = tglList();
        const container = document.getElementById('listTgl');
        const empty = document.getElementById('emptyTgl');
        const jumlah = document.getElementById('jumlahTanggal');

        jumlah.textContent = list.length + ' tanggal';
        empty.classList.toggle('d-none', list.length > 0);

        container.innerHTML = '';
        list.forEach(iso => {
            const rec = data.records[iso] || {};
            const c = hitungHari(rec);
            const aktif = iso === getTanggal();
            const item = document.createElement('div');
            item.className = 'tgl-item mb-2' + (aktif ? ' active' : '');
            item.onclick = () => pilihTgl(iso);
            const [y, m, d] = iso.split('-');
            item.innerHTML = `
                <div class="tgl-num"><span>${Number(d)}</span><small>${BULAN[Number(m) - 1].slice(0, 3)}</small></div>
                <div class="flex-grow-1">
                    <div class="fw-semibold small">${HARI[new Date(y, m - 1, d).getDay()]}, ${Number(d)} ${BULAN[Number(m) - 1]} ${y}</div>
                    <div class="small text-secondary">
                        <span class="st-hadir st-badge">${c.hadir} H</span>
                        <span class="st-sakit st-badge">${c.sakit} S</span>
                        <span class="st-izin st-badge">${c.izin} I</span>
                        <span class="st-alpa st-badge">${c.alpa} A</span>
                        <span class="st-b st-badge">${c.belum} -</span>
                    </div>
                </div>
                ${aktif ? '<i class="bi bi-check2-circle text-primary"></i>' : ''}`;
            container.appendChild(item);
        });
    }

    function renderFilter() {
        const defs = [
            { key: 'semua', label: 'Semua', cls: 'active-semua', icon: 'bi-grid' },
            { key: 'hadir', label: 'Hadir', cls: 'active-hadir', icon: 'bi-check2-circle' },
            { key: 'sakit', label: 'Sakit', cls: 'active-sakit', icon: 'bi-heart-pulse' },
            { key: 'izin',  label: 'Izin',  cls: 'active-izin',  icon: 'bi-calendar2-x' },
            { key: 'alpa',  label: 'Alpa',  cls: 'active-alpa',  icon: 'bi-x-circle' },
            { key: 'belum', label: 'Belum', cls: 'active-belum', icon: 'bi-question-circle' }
        ];
        document.getElementById('filterBox').innerHTML = defs.map(d => `
            <button class="filter-btn ${filter === d.key ? d.cls : ''}" onclick="setFilter('${d.key}')">
                <i class="bi ${d.icon} me-1"></i>${d.label}
            </button>`).join('');
    }

    function setFilter(f) {
        filter = f;
        renderFilter();
        renderTabel();
    }

    function hapusTgl(iso) {
        if (!confirm(`Hapus SEMUA data absen pada ${formatTanggal(iso)}? Tindakan ini tidak bisa dibatalkan.`)) return;
        delete data.records[iso];
        saveData();
        render();
        showToast('Data absen tanggal tersebut dihapus.');
    }

    function hapusAbsen(tgl, nama) {
        if (!confirm(`Hapus absen "${nama}" pada ${formatTanggal(tgl)}?`)) return;
        if (data.records[tgl]) delete data.records[tgl][nama];
        saveData();
        render();
        showToast(`Absen "${nama}" dihapus.`);
    }

    function renderStat(rec) {
        const c = hitungHari(rec);
        const cards = [
            { label: 'Hadir', count: c.hadir, ic: 'ic-hadir', icon: 'bi-check2-circle' },
            { label: 'Sakit', count: c.sakit, ic: 'ic-sakit', icon: 'bi-heart-pulse' },
            { label: 'Izin',  count: c.izin,  ic: 'ic-izin',  icon: 'bi-calendar2-x' },
            { label: 'Alpa',  count: c.alpa,  ic: 'ic-alpa',  icon: 'bi-x-circle' },
            { label: 'Belum', count: c.belum, ic: 'ic-belum', icon: 'bi-question-circle' }
        ];
        document.getElementById('statCards').innerHTML = cards.map(cd => `
            <div class="col-6 col-md">
                <div class="stat-card p-2 p-sm-3 d-flex align-items-center gap-2">
                    <div class="stat-icon ${cd.ic}"><i class="bi ${cd.icon}"></i></div>
                    <div>
                        <div class="fs-5 fw-bold lh-1">${cd.count}</div>
                        <div class="small text-secondary">${cd.label}</div>
                    </div>
                </div>
            </div>`).join('');
    }

    function renderTabel() {
        const tgl = getTanggal();
        const rec = data.records[tgl] || {};
        const q = document.getElementById('inputCari').value.trim().toLowerCase();
        const tbody = document.getElementById('tbodyPeserta');
        const empty = document.getElementById('emptyPeserta');

        let daftar = data.peserta.filter(n => !q || n.toLowerCase().includes(q));
        if (filter !== 'semua') {
            daftar = daftar.filter(n => {
                const s = rec[n];
                if (filter === 'belum') return !s;
                return s === filter;
            });
        }

        tbody.innerHTML = '';
        daftar.forEach((nama, i) => {
            const st = rec[nama] ? STATUS[rec[nama]] : null;
            const badge = st
                ? `<span class="st-badge st-${rec[nama]}"><i class="bi ${st.icon} me-1"></i>${st.label}</span>`
                : `<span class="st-badge st-b">Belum</span>`;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="text-secondary">${i + 1}</td>
                <td><div class="d-flex align-items-center gap-2">
                    <span class="avatar">${inisial(nama)}</span>
                    <span class="fw-semibold">${esc(nama)}</span>
                </div></td>
                <td class="text-center">${badge}</td>
                <td class="text-center">
                    <button class="btn-hapus px-2 py-1" title="Hapus absen peserta ini" onclick="hapusAbsen('${tgl}','${inline(nama)}')"><i class="bi bi-x-lg"></i></button>
                </td>`;
            tbody.appendChild(tr);
        });

        empty.classList.toggle('d-none', daftar.length > 0);
    }

    function render() {
        const tgl = getTanggal() || tanggalHariIni();
        document.getElementById('inputTanggal').value = tgl;
        document.getElementById('heroTanggal').textContent = formatTanggal(tgl);
        document.getElementById('judulTgl').textContent = formatTanggal(tgl);
        renderListTgl();
        renderFilter();
        renderStat(data.records[tgl] || {});
        renderTabel();
    }

    initTema();
    const daftar = tglList();
    if (daftar.length > 0) {
        document.getElementById('inputTanggal').value = daftar[0];
    } else {
        document.getElementById('inputTanggal').value = tanggalHariIni();
    }
    render();
</script>

</body>
</html>
